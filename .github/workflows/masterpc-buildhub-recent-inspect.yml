name: MASTER-PC BuildHub Recent Inspect

on:
  push:
    branches: ["ops/masterpc-recovery-20260912"]
    paths: [".github/workflows/masterpc-buildhub-recent-inspect.yml"]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Inspect latest BuildHub workspace through bridge
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://fantest.win/runner'
          test "$(curl -sS -o /dev/null -w '%{http_code}' "$BASE/api.php?action=ping")" = 200
          curl -fsSL -c cookies.txt -b cookies.txt "$BASE/" -o runner.html
          CSRF="$(python - <<'PY'
          import re,json
          t=open('runner.html',encoding='utf-8',errors='replace').read();m=re.search(r'window\.FANTESTOS_RUNNER_CSRF=(.*?);',t)
          if not m: raise SystemExit('CSRF missing')
          print(json.loads(m.group(1)))
          PY
          )"
          cat > inspect.ps1 <<'PS1'
          $ErrorActionPreference='SilentlyContinue'
          function Tree([string]$p,[int]$depth=3){
            Write-Host "===== TREE $p ====="
            if(-not(Test-Path $p)){Write-Host 'MISSING';return}
            $root=(Get-Item $p).FullName
            Get-ChildItem -LiteralPath $root -Force -Recurse -Depth $depth -ErrorAction SilentlyContinue | Select-Object -First 400 FullName,PSIsContainer,Length,LastWriteTimeUtc | Format-Table -AutoSize
          }
          Tree 'C:\FantestBuildHub\Workspaces\build-20260912-164544-745fae' 4
          Tree 'C:\FantestBuildHub\Projects\Remote' 3
          Tree 'C:\FantestBuildHub\Projects\Sources' 3
          Tree 'C:\FantestBuildHub\Projects\ExactInputs' 3
          Write-Host '===== TEXT HINTS ====='
          foreach($root in @('C:\FantestBuildHub\Workspaces\build-20260912-164544-745fae','C:\FantestBuildHub\Projects\Remote','C:\FantestBuildHub\Projects\Sources','C:\FantestBuildHub\Projects\ExactInputs')){
            if(Test-Path $root){
              Get-ChildItem $root -File -Recurse -ErrorAction SilentlyContinue | Where-Object {$_.Length -lt 2MB -and $_.Extension -match '^\.(json|txt|log|yml|yaml|md|ps1|cmd|csproj)$'} | Select-Object -First 120 | ForEach-Object {
                $m=Select-String -LiteralPath $_.FullName -Pattern 'FantestADBMonitor|2a8c1d615a08f509ccf33cb7b144fb1982da6872|59153ab55cd52bb5bc0c60b388c3b57d8f28701d' -SimpleMatch -ErrorAction SilentlyContinue
                if($m){Write-Host "HIT=$($_.FullName)"; $m | Select-Object -First 12 | ForEach-Object {Write-Host ($_.Line.Trim())}}
              }
            }
          }
          Write-Host 'BUILDHUB_RECENT_INSPECT=PASS'
          PS1
          curl -fsS -b cookies.txt -c cookies.txt -X POST "$BASE/api.php" --data-urlencode 'action=start' --data-urlencode "csrf=$CSRF" --data-urlencode 'runtime=powershell' --data-urlencode 'execution_mode=background' --data-urlencode 'working_directory=C:\' --data-urlencode 'timeout=150' --data-urlencode 'command@inspect.ps1' -o start.json
          JOB_ID="$(python - <<'PY'
          import json
          d=json.load(open('start.json'));assert d.get('ok') and d.get('job_id');print(d['job_id'])
          PY
          )"
          out=0;err=0;:>stdout.log;:>stderr.log;final=''
          for i in $(seq 1 55);do
            curl -fsS -b cookies.txt -c cookies.txt "$BASE/api.php?action=status&csrf=$CSRF&job_id=$JOB_ID&out_offset=$out&err_offset=$err" -o status.json
            python - <<'PY' > p.env
          import json,shlex
          d=json.load(open('status.json'));print('STATUS='+shlex.quote(str(d.get('status',''))));print('OUT='+str(int(d.get('out_offset',0))));print('ERR='+str(int(d.get('err_offset',0))));open('o','wb').write(str(d.get('stdout_chunk','')).encode());open('e','wb').write(str(d.get('stderr_chunk','')).encode())
          PY
            . ./p.env;out=$OUT;err=$ERR;cat o >>stdout.log;cat e >>stderr.log
            case "$STATUS" in completed|failed|cancelled|timed_out|output_limited)final="$STATUS";break;;esac;sleep 2
          done
          cat stdout.log;cat stderr.log >&2 || true;echo "FINAL=$final";test "$final" = completed;grep -q 'BUILDHUB_RECENT_INSPECT=PASS' stdout.log
