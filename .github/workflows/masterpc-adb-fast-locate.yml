name: MASTER-PC FantestADB Fast Locate

on:
  push:
    branches: ["ops/masterpc-recovery-20260912"]
    paths: [".github/workflows/masterpc-adb-fast-locate.yml"]

permissions:
  contents: read

jobs:
  locate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Locate likely cached checkout through bridge
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://fantest.win/runner'
          test "$(curl -sS -o /dev/null -w '%{http_code}' "$BASE/api.php?action=ping")" = 200
          curl -fsSL -c cookies.txt -b cookies.txt "$BASE/" -o runner.html
          CSRF="$(python - <<'PY'
          import re,json
          t=open('runner.html',encoding='utf-8',errors='replace').read();m=re.search(r'window\.FANTESTOS_RUNNER_CSRF=(.*?);',t)
          if not m: raise SystemExit('CSRF missing')
          print(json.loads(m.group(1)))
          PY
          )"
          cat > locate.ps1 <<'PS1'
          $ErrorActionPreference='SilentlyContinue'
          function Walk([string]$root,[int]$maxDepth){
            if(-not (Test-Path $root)){return}
            $q=New-Object 'System.Collections.Generic.Queue[object]'
            $q.Enqueue(@($root,0))
            while($q.Count -gt 0){
              $item=$q.Dequeue();$dir=[string]$item[0];$depth=[int]$item[1]
              try{
                foreach($f in Get-ChildItem -LiteralPath $dir -File -ErrorAction Stop){
                  if($f.Name -eq 'FantestADBMonitor.Windows.csproj'){Write-Host "MATCH=$($f.FullName)"}
                }
                if($depth -lt $maxDepth){
                  foreach($d in Get-ChildItem -LiteralPath $dir -Directory -ErrorAction Stop){
                    if($d.Name -notin @('node_modules','.gradle','packages','Windows','Program Files','Program Files (x86)','$Recycle.Bin','System Volume Information')){$q.Enqueue(@($d.FullName,$depth+1))}
                  }
                }
              }catch{}
            }
          }
          foreach($root in @('C:\Khalil','C:\FantestBuildHub','C:\ProgramData\Fantest','C:\actions-runner','C:\GitHubRunner','D:\FantestBuildHub','D:\MasterPC-ControlCenter','D:\Repos','D:\Projects','D:\GitHubRunner')){Walk $root 5}
          foreach($path in @(
            'C:\Program Files\FantestADBMonitor\FantestADBMonitor.exe',
            'C:\FantestADBMonitor\windows-agent\FantestADBMonitor.Windows.csproj',
            'D:\FantestADBMonitor\windows-agent\FantestADBMonitor.Windows.csproj',
            'D:\Repos\FantestADBMonitor\windows-agent\FantestADBMonitor.Windows.csproj',
            'C:\actions-runner\_work\FantestADBMonitor\FantestADBMonitor\windows-agent\FantestADBMonitor.Windows.csproj'
          )){Write-Host "PROBE $path EXISTS=$(Test-Path $path)"}
          Write-Host 'FAST_LOCATE=PASS'
          PS1
          curl -fsS -b cookies.txt -c cookies.txt -X POST "$BASE/api.php" --data-urlencode 'action=start' --data-urlencode "csrf=$CSRF" --data-urlencode 'runtime=powershell' --data-urlencode 'execution_mode=background' --data-urlencode 'working_directory=C:\' --data-urlencode 'timeout=120' --data-urlencode 'command@locate.ps1' -o start.json
          JOB_ID="$(python - <<'PY'
          import json
          d=json.load(open('start.json'));assert d.get('ok') and d.get('job_id');print(d['job_id'])
          PY
          )"
          out=0;err=0;:>stdout.log;:>stderr.log;final=''
          for i in $(seq 1 45);do
            curl -fsS -b cookies.txt -c cookies.txt "$BASE/api.php?action=status&csrf=$CSRF&job_id=$JOB_ID&out_offset=$out&err_offset=$err" -o status.json
            python - <<'PY' > p.env
          import json,shlex
          d=json.load(open('status.json'));print('STATUS='+shlex.quote(str(d.get('status',''))));print('OUT='+str(int(d.get('out_offset',0))));print('ERR='+str(int(d.get('err_offset',0))));open('o','wb').write(str(d.get('stdout_chunk','')).encode());open('e','wb').write(str(d.get('stderr_chunk','')).encode())
          PY
            . ./p.env;out=$OUT;err=$ERR;cat o >>stdout.log;cat e >>stderr.log
            case "$STATUS" in completed|failed|cancelled|timed_out|output_limited)final="$STATUS";break;;esac;sleep 2
          done
          cat stdout.log;cat stderr.log >&2 || true;echo "FINAL=$final";test "$final" = completed;grep -q 'FAST_LOCATE=PASS' stdout.log
