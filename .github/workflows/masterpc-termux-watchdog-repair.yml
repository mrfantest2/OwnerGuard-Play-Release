name: MASTER-PC Termux Watchdog Repair

on:
  push:
    branches: ["ops/masterpc-recovery-20260912"]
    paths: [".github/workflows/masterpc-termux-watchdog-repair.yml"]

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Restore watchdog through FantestOS bridge
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://fantest.win/runner'
          test "$(curl -sS -o /dev/null -w '%{http_code}' "$BASE/api.php?action=ping")" = 200
          curl -fsSL -c cookies.txt -b cookies.txt "$BASE/" -o runner.html
          CSRF="$(python - <<'PY'
          import re,json
          t=open('runner.html',encoding='utf-8',errors='replace').read();m=re.search(r'window\.FANTESTOS_RUNNER_CSRF=(.*?);',t)
          if not m: raise SystemExit('CSRF missing')
          print(json.loads(m.group(1)))
          PY
          )"
          cat > repair.ps1 <<'PS1'
          Set-StrictMode -Version Latest
          $ErrorActionPreference='Stop'
          $agentRoot='C:\Program Files\Fantest\Termux_Edge_PC_Agent'
          $workerTask='Fantest Termux Edge Worker - master_pc'
          $watchdogTask='Fantest Termux Edge Watchdog - master_pc'
          if(-not (Test-Path $agentRoot)){throw "Agent root missing: $agentRoot"}
          if(-not (Get-ScheduledTask -TaskName $workerTask -ErrorAction SilentlyContinue)){throw "Worker task missing: $workerTask"}
          $stateDir=Join-Path $agentRoot '_watchdog'
          New-Item -ItemType Directory -Force -Path $stateDir | Out-Null
          $watchdogPath=Join-Path $stateDir 'Watchdog-TermuxEdge.ps1'
          $logPath=Join-Path $stateDir 'watchdog.log'
          @'
          param([string]$WorkerTaskName,[int]$HealthPort=8787,[string]$LogPath)
          $ErrorActionPreference='SilentlyContinue'
          function Test-Port([int]$Port){
            $c=New-Object System.Net.Sockets.TcpClient
            try{$a=$c.BeginConnect('127.0.0.1',$Port,$null,$null);if(-not $a.AsyncWaitHandle.WaitOne(750)){return $false};$c.EndConnect($a);return $true}catch{return $false}finally{$c.Dispose()}
          }
          function Log([string]$m){if($LogPath){Add-Content -LiteralPath $LogPath -Value ((Get-Date -Format s)+' '+$m) -Encoding UTF8}}
          if(Test-Port $HealthPort){Log 'HEALTH_OK';exit 0}
          $task=Get-ScheduledTask -TaskName $WorkerTaskName -ErrorAction SilentlyContinue
          if(-not $task){Log "ERROR worker task missing: $WorkerTaskName";exit 2}
          Log "RECOVERY port $HealthPort unhealthy; restarting worker task"
          Stop-ScheduledTask -TaskName $WorkerTaskName -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2
          Start-ScheduledTask -TaskName $WorkerTaskName -ErrorAction SilentlyContinue
          for($i=0;$i -lt 30;$i++){Start-Sleep 1;if(Test-Port $HealthPort){Log 'RECOVERY_OK';exit 0}}
          Log 'RECOVERY_FAILED'
          exit 1
          '@ | Set-Content -LiteralPath $watchdogPath -Encoding UTF8
          $ps=(Get-Command powershell.exe -ErrorAction Stop).Source
          $arg='-NoProfile -NonInteractive -ExecutionPolicy Bypass -WindowStyle Hidden -File "{0}" -WorkerTaskName "{1}" -HealthPort 8787 -LogPath "{2}"' -f $watchdogPath,$workerTask,$logPath
          $action=New-ScheduledTaskAction -Execute $ps -Argument $arg -WorkingDirectory $agentRoot
          $boot=New-ScheduledTaskTrigger -AtStartup
          $repeat=New-ScheduledTaskTrigger -Once -At (Get-Date).AddMinutes(1) -RepetitionInterval (New-TimeSpan -Minutes 1)
          $principal=New-ScheduledTaskPrincipal -UserId 'SYSTEM' -LogonType ServiceAccount -RunLevel Highest
          $settings=New-ScheduledTaskSettingsSet -AllowStartIfOnBatteries -DontStopIfGoingOnBatteries -StartWhenAvailable -MultipleInstances IgnoreNew
          Register-ScheduledTask -TaskName $watchdogTask -Action $action -Trigger @($boot,$repeat) -Principal $principal -Settings $settings -Force | Out-Null
          Start-ScheduledTask -TaskName $watchdogTask
          Start-Sleep -Seconds 3
          $wd=Get-ScheduledTask -TaskName $watchdogTask -ErrorAction Stop
          Write-Host "WATCHDOG_STATE=$($wd.State)"
          $info=Get-ScheduledTaskInfo -TaskName $watchdogTask
          Write-Host "WATCHDOG_LAST_RESULT=$($info.LastTaskResult)"
          $c=New-Object System.Net.Sockets.TcpClient
          try{$a=$c.BeginConnect('127.0.0.1',8787,$null,$null);$ok=$a.AsyncWaitHandle.WaitOne(1000);if($ok){$c.EndConnect($a)}}finally{$c.Dispose()}
          if(-not $ok){throw 'Port 8787 is not listening.'}
          Write-Host 'TERMUX_8787=LISTEN'
          Write-Host 'TERMUX_WATCHDOG_REPAIR=PASS'
          PS1
          curl -fsS -b cookies.txt -c cookies.txt -X POST "$BASE/api.php" --data-urlencode 'action=start' --data-urlencode "csrf=$CSRF" --data-urlencode 'runtime=powershell' --data-urlencode 'execution_mode=background' --data-urlencode 'working_directory=C:\' --data-urlencode 'timeout=180' --data-urlencode 'command@repair.ps1' -o start.json
          JOB_ID="$(python - <<'PY'
          import json
          d=json.load(open('start.json'));assert d.get('ok') and d.get('job_id');print(d['job_id'])
          PY
          )"
          out=0;err=0;:>stdout.log;:>stderr.log;final=''
          for i in $(seq 1 65);do
            curl -fsS -b cookies.txt -c cookies.txt "$BASE/api.php?action=status&csrf=$CSRF&job_id=$JOB_ID&out_offset=$out&err_offset=$err" -o status.json
            python - <<'PY' > p.env
          import json,shlex
          d=json.load(open('status.json'));print('STATUS='+shlex.quote(str(d.get('status',''))));print('OUT='+str(int(d.get('out_offset',0))));print('ERR='+str(int(d.get('err_offset',0))));open('o','wb').write(str(d.get('stdout_chunk','')).encode());open('e','wb').write(str(d.get('stderr_chunk','')).encode())
          PY
            . ./p.env;out=$OUT;err=$ERR;cat o >>stdout.log;cat e >>stderr.log
            case "$STATUS" in completed|failed|cancelled|timed_out|output_limited)final="$STATUS";break;;esac;sleep 2
          done
          cat stdout.log;cat stderr.log >&2 || true;echo "FINAL=$final";test "$final" = completed;grep -q 'TERMUX_WATCHDOG_REPAIR=PASS' stdout.log
