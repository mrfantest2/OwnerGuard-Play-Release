name: MASTER-PC BuildHub FantestADB Locate

on:
  push:
    branches: ["ops/masterpc-recovery-20260912"]
    paths: [".github/workflows/masterpc-buildhub-adb-locate.yml"]

permissions:
  contents: read

jobs:
  locate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Inspect BuildHub workspace through bridge
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://fantest.win/runner'
          test "$(curl -sS -o /dev/null -w '%{http_code}' "$BASE/api.php?action=ping")" = 200
          curl -fsSL -c cookies.txt -b cookies.txt "$BASE/" -o runner.html
          CSRF="$(python - <<'PY'
          import re,json
          t=open('runner.html',encoding='utf-8',errors='replace').read();m=re.search(r'window\.FANTESTOS_RUNNER_CSRF=(.*?);',t)
          if not m: raise SystemExit('CSRF missing')
          print(json.loads(m.group(1)))
          PY
          )"
          cat > inspect.ps1 <<'PS1'
          $ErrorActionPreference='SilentlyContinue'
          function List2([string]$p){
            Write-Host "===== $p ====="
            if(-not (Test-Path $p)){Write-Host 'MISSING';return}
            Get-ChildItem -LiteralPath $p -Force | Sort-Object LastWriteTimeUtc -Descending | Select-Object -First 80 Name,FullName,PSIsContainer,LastWriteTimeUtc | Format-Table -AutoSize
            foreach($d in Get-ChildItem -LiteralPath $p -Directory -ErrorAction SilentlyContinue | Select-Object -First 80){
              if($d.Name -match '(?i)(adb|android|monitor|fantest)'){
                Write-Host "-- CHILD $($d.FullName)"
                Get-ChildItem -LiteralPath $d.FullName -Force | Select-Object -First 80 Name,FullName,PSIsContainer,LastWriteTimeUtc | Format-Table -AutoSize
              }
            }
          }
          foreach($p in @(
            'C:\FantestBuildHub\Projects',
            'C:\FantestBuildHub\Workspaces',
            'C:\FantestBuildHub\Artifacts',
            'C:\FantestBuildHub\Source',
            'D:\FantestBuildHub\Projects',
            'D:\FantestBuildHub\Workspaces',
            'D:\FantestBuildHub\Artifacts',
            'D:\FantestBuildHub\Source'
          )){List2 $p}
          Write-Host '===== INSTALLED EXE ====='
          $exe='C:\Program Files\FantestADBMonitor\FantestADBMonitor.exe'
          if(Test-Path $exe){
            $i=Get-Item $exe
            $v=$i.VersionInfo
            Write-Host "EXE=$exe size=$($i.Length) utc=$($i.LastWriteTimeUtc.ToString('o')) version=$($v.FileVersion) product=$($v.ProductVersion) sha256=$((Get-FileHash $exe -Algorithm SHA256).Hash)"
          }
          Write-Host 'BUILDHUB_ADB_LOCATE=PASS'
          PS1
          curl -fsS -b cookies.txt -c cookies.txt -X POST "$BASE/api.php" --data-urlencode 'action=start' --data-urlencode "csrf=$CSRF" --data-urlencode 'runtime=powershell' --data-urlencode 'execution_mode=background' --data-urlencode 'working_directory=C:\' --data-urlencode 'timeout=150' --data-urlencode 'command@inspect.ps1' -o start.json
          JOB_ID="$(python - <<'PY'
          import json
          d=json.load(open('start.json'));assert d.get('ok') and d.get('job_id');print(d['job_id'])
          PY
          )"
          out=0;err=0;:>stdout.log;:>stderr.log;final=''
          for i in $(seq 1 55);do
            curl -fsS -b cookies.txt -c cookies.txt "$BASE/api.php?action=status&csrf=$CSRF&job_id=$JOB_ID&out_offset=$out&err_offset=$err" -o status.json
            python - <<'PY' > p.env
          import json,shlex
          d=json.load(open('status.json'));print('STATUS='+shlex.quote(str(d.get('status',''))));print('OUT='+str(int(d.get('out_offset',0))));print('ERR='+str(int(d.get('err_offset',0))));open('o','wb').write(str(d.get('stdout_chunk','')).encode());open('e','wb').write(str(d.get('stderr_chunk','')).encode())
          PY
            . ./p.env;out=$OUT;err=$ERR;cat o >>stdout.log;cat e >>stderr.log
            case "$STATUS" in completed|failed|cancelled|timed_out|output_limited)final="$STATUS";break;;esac;sleep 2
          done
          cat stdout.log;cat stderr.log >&2 || true;echo "FINAL=$final";test "$final" = completed;grep -q 'BUILDHUB_ADB_LOCATE=PASS' stdout.log
