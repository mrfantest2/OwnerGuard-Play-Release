name: MASTER-PC CCC Runner Debug

on:
  push:
    branches: ["ops/masterpc-recovery-20260912"]
    paths: [".github/workflows/masterpc-ccc-runner-debug.yml"]

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Inspect CCC runner service through FantestOS bridge
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://fantest.win/runner'
          test "$(curl -sS -o /dev/null -w '%{http_code}' "$BASE/api.php?action=ping")" = 200
          curl -fsSL -c cookies.txt -b cookies.txt "$BASE/" -o runner.html
          CSRF="$(python - <<'PY'
          import re,json
          t=open('runner.html',encoding='utf-8',errors='replace').read();m=re.search(r'window\.FANTESTOS_RUNNER_CSRF=(.*?);',t)
          if not m: raise SystemExit('CSRF missing')
          print(json.loads(m.group(1)))
          PY
          )"
          cat > debug.ps1 <<'PS1'
          $ErrorActionPreference='Continue'
          $name='actions.runner.mrfantest2-control-command-center.MASTER-PC-CCC-CONTROL'
          $root='C:\actions-runner-ccc-control'
          $s=Get-CimInstance Win32_Service -Filter ("Name='"+$name+"'")
          if($s){Write-Host "SERVICE state=$($s.State) start=$($s.StartMode) account=$($s.StartName) pid=$($s.ProcessId) exit=$($s.ExitCode) specific=$($s.ServiceSpecificExitCode) path=$($s.PathName)"}else{Write-Host 'SERVICE=MISSING'}
          Write-Host "ROOT_EXISTS=$(Test-Path $root)"
          foreach($p in @('bin\RunnerService.exe','bin\Runner.Listener.exe','config.cmd','.runner','.credentials','.credentials_rsaparams','.service')){
            Write-Host "FILE $p EXISTS=$(Test-Path (Join-Path $root $p))"
          }
          if(Test-Path (Join-Path $root '.runner')){
            try{$j=Get-Content (Join-Path $root '.runner') -Raw|ConvertFrom-Json;Write-Host "CONFIG agentName=$($j.agentName) poolName=$($j.poolName) workFolder=$($j.workFolder) serverUrl=$($j.serverUrl) gitHubUrl=$($j.gitHubUrl)"}catch{Write-Host "CONFIG_ERROR=$($_.Exception.Message)"}
          }
          if(Test-Path (Join-Path $root 'bin\Runner.Listener.exe')){try{$v=& (Join-Path $root 'bin\Runner.Listener.exe') --version 2>$null;Write-Host "VERSION=$v"}catch{Write-Host "VERSION_ERROR=$($_.Exception.Message)"}}
          Write-Host 'LATEST_DIAG:'
          $diag=Join-Path $root '_diag'
          if(Test-Path $diag){
            Get-ChildItem $diag -File | Sort-Object LastWriteTimeUtc -Descending | Select-Object -First 3 | ForEach-Object {
              Write-Host "--- $($_.Name) utc=$($_.LastWriteTimeUtc.ToString('o')) size=$($_.Length)"
              Get-Content $_.FullName -Tail 45 | ForEach-Object { if($_ -notmatch '(?i)(token|authorization|credential|password|secret)'){Write-Host $_} }
            }
          }else{Write-Host 'DIAG_MISSING'}
          Write-Host 'SCM_EVENTS:'
          Get-WinEvent -FilterHashtable @{LogName='System';ProviderName='Service Control Manager';StartTime=(Get-Date).AddHours(-24)} -ErrorAction SilentlyContinue | Where-Object {$_.Message -like "*$name*" -or $_.Message -like '*MASTER-PC-CCC-CONTROL*'} | Select-Object -First 12 | ForEach-Object {Write-Host "EVENT id=$($_.Id) utc=$($_.TimeCreated.ToUniversalTime().ToString('o')) msg=$($_.Message -replace '[\r\n]+',' ')"}
          Write-Host 'CCC_RUNNER_DEBUG=PASS'
          PS1
          curl -fsS -b cookies.txt -c cookies.txt -X POST "$BASE/api.php" --data-urlencode 'action=start' --data-urlencode "csrf=$CSRF" --data-urlencode 'runtime=powershell' --data-urlencode 'execution_mode=background' --data-urlencode 'working_directory=C:\' --data-urlencode 'timeout=160' --data-urlencode 'command@debug.ps1' -o start.json
          JOB_ID="$(python - <<'PY'
          import json
          d=json.load(open('start.json'));assert d.get('ok') and d.get('job_id');print(d['job_id'])
          PY
          )"
          out=0;err=0;:>stdout.log;:>stderr.log;final=''
          for i in $(seq 1 60);do
            curl -fsS -b cookies.txt -c cookies.txt "$BASE/api.php?action=status&csrf=$CSRF&job_id=$JOB_ID&out_offset=$out&err_offset=$err" -o status.json
            python - <<'PY' > p.env
          import json,shlex
          d=json.load(open('status.json'));print('STATUS='+shlex.quote(str(d.get('status',''))));print('OUT='+str(int(d.get('out_offset',0))));print('ERR='+str(int(d.get('err_offset',0))));open('o','wb').write(str(d.get('stdout_chunk','')).encode());open('e','wb').write(str(d.get('stderr_chunk','')).encode())
          PY
            . ./p.env;out=$OUT;err=$ERR;cat o >>stdout.log;cat e >>stderr.log
            case "$STATUS" in completed|failed|cancelled|timed_out|output_limited)final="$STATUS";break;;esac;sleep 2
          done
          cat stdout.log;cat stderr.log >&2 || true;echo "FINAL=$final";test "$final" = completed;grep -q 'CCC_RUNNER_DEBUG=PASS' stdout.log
