plugins {
    id 'com.android.application'
}

android {
    namespace 'com.fantest.ownerguard'
    compileSdk 36

    defaultConfig {
        applicationId 'com.fantest.ownerguard'
        minSdk 28
        targetSdk 35
        versionCode 10027
        versionName '1.0.27'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

// OwnerGuard has two legitimate signing identities when Google Play App Signing is enabled:
// 1) the historical/app-signing certificate used on Play-distributed installs, and
// 2) the separate Play upload certificate used only to authenticate uploads to Google Play.
// The historical fingerprint remains pinned in source. The upload fingerprint must be supplied
// by the protected release environment as EXPECTED_UPLOAD_CERT_SHA256; an unset value does not
// broaden trust and therefore keeps direct/local signing restricted to the historical identity.
def OWNERGUARD_HISTORICAL_SIGNING_CERT_SHA256 = 'BC2E0B8928F9D9F981DB1AF5595D0168D54F73FC9A7AB52D8CED6AD0E5979C9E'
def normalizeCertSha256 = { value ->
    (value ?: '').toString().toUpperCase().replaceAll(/[^0-9A-F]/, '')
}
def expectedPlayUploadCertSha256 = normalizeCertSha256(System.getenv('EXPECTED_UPLOAD_CERT_SHA256'))
def signingProps = new Properties()
def signingFile = rootProject.file('signing/keystore.properties')
if (signingFile.exists()) {
    signingProps.load(new FileInputStream(signingFile))
    def configuredStore = rootProject.file(signingProps['storeFile'])
    if (!configuredStore.isFile()) {
        throw new GradleException('OwnerGuard signing keystore is missing.')
    }

    def signingCertificate = null
    for (String storeType : ['JKS', 'PKCS12']) {
        if (signingCertificate != null) break
        try {
            def keyStore = java.security.KeyStore.getInstance(storeType)
            configuredStore.withInputStream { stream ->
                keyStore.load(stream, signingProps['storePassword'].toCharArray())
            }
            signingCertificate = keyStore.getCertificate(signingProps['keyAlias'])
        } catch (Exception ignored) {
            // Try the other common Android keystore container format without
            // logging credentials, aliases, private-key material, or errors.
        }
    }
    if (signingCertificate == null) {
        throw new GradleException('Unable to read the configured OwnerGuard signing certificate.')
    }

    def actualSigningCertSha256 = java.security.MessageDigest.getInstance('SHA-256')
        .digest(signingCertificate.encoded)
        .collect { byteValue -> String.format('%02X', ((byteValue as int) & 0xFF)) }
        .join()
    def matchesProtectedPlayUploadCert = expectedPlayUploadCertSha256 && actualSigningCertSha256 == expectedPlayUploadCertSha256
    if (actualSigningCertSha256 != OWNERGUARD_HISTORICAL_SIGNING_CERT_SHA256 && !matchesProtectedPlayUploadCert) {
        throw new GradleException('OwnerGuard signing certificate fingerprint mismatch; refusing to sign with an identity that is neither the pinned app-signing certificate nor the protected Play upload certificate.')
    }

    android.signingConfigs {
        releaseKey {
            storeFile configuredStore
            storePassword signingProps['storePassword']
            keyAlias signingProps['keyAlias']
            keyPassword signingProps['keyPassword']
        }
    }
    android.buildTypes.debug.signingConfig android.signingConfigs.releaseKey
    android.buildTypes.release.signingConfig android.signingConfigs.releaseKey
}

dependencies {
    implementation 'androidx.work:work-runtime:2.10.3'
}
